name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# If you push twice quickly, cancel the older run so you never deploy a stale commit.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint · Build · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --ci

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    # Extra guard: only the real main branch on this repo ever deploys.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Trigger Render deploy
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
